category: grains
# The kitchen is fully gluten-free: the pantry tiles are the GF products. Everyday wheat words in recipes
# ("spaghetti", "tészta", "nokedli"…) match the hidden `contains` items below, which swap to the GF tiles.
groups:
  - id: pasta
    en: Pasta (GF)
    hu: Tészta (gluténmentes)
    icon: "om:1F35D"
    items:
      - {id: gf-pasta-long, en: Long pasta, hu: Hosszú tészta, icon: "om:1F35D", aliases: [gf spaghetti, gluten-free spaghetti, gluténmentes spagetti, gf linguine, gf tagliatelle, gm spagetti]}
      - {id: gf-pasta-short, en: Short pasta, hu: Rövid tészta, aliases: [gf pasta, gluten-free pasta, gluténmentes tészta, gf penne, gf fusilli, gf macaroni, gm tészta, gluténmentes makaróni]}
      - {id: gf-lasagne, en: Lasagne sheets, hu: Lasagne lap, aliases: [gf lasagne, gluten-free lasagne, gluténmentes lasagne lap]}
