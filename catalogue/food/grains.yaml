      - {id: wheat-pasta-long, en: Long pasta (wheat), hu: Hosszú tészta (búza), gluten: contains, swap: gf-pasta-long, pantry: false, aliases: [spaghetti, spagetti, linguine, tagliatelle, fettuccine, long pasta, hosszú tészta, spagettit, metélt], tip_en: "GF pasta overcooks fast: boil it 1–2 minutes less than the packet says and rinse briefly.", tip_hu: "A GM tészta könnyen szétfő: 1–2 perccel rövidebben főzd, mint a csomagon áll, és öblítsd le röviden."}
      - {id: wheat-pasta-short, en: Pasta (wheat), hu: Tészta (búza), gluten: contains, swap: gf-pasta-short, pantry: false, aliases: [pasta, tészta, penne, fusilli, macaroni, makaróni, farfalle, masni, masnitészta, orsótészta, csavart tészta, rigatoni, short pasta, rövid tészta, száraztészta, tésztát, szarvacska], tip_en: "GF pasta overcooks fast: boil it 1–2 minutes less than the packet says and rinse briefly.", tip_hu: "A GM tészta könnyen szétfő: 1–2 perccel rövidebben főzd, mint a csomagon áll, és öblítsd le röviden."}
      - {id: wheat-lasagne, en: Lasagne sheets (wheat), hu: Lasagne lap (búza), gluten: contains, swap: gf-lasagne, pantry: false, aliases: [lasagne, lasagna, lasagna sheets, lasagne sheets, lasagne lap, lasagne lapok, lasagnelap], tip_en: "GF lasagne sheets: pre-boil briefly unless the packet says oven-ready, and use a little more sauce.", tip_hu: "GM lasagne lap: röviden főzd elő, hacsak a csomagon nem áll, hogy elősütés nélküli, és tegyél bele kicsit több szószt."}
      - {id: soup-noodles, en: Soup noodles (wheat), hu: Levestészta (búza), gluten: contains, swap: gf-soup-noodles, pantry: false, aliases: [soup noodles, soup pasta, cérnametélt, levestészta, csigatészta, betűtészta, eperlevél, vermicelli, angel hair, kagylótészta], tip_en: "Cook GF soup noodles separately and add them to the bowl, or they turn the soup cloudy and mushy.", tip_hu: "A GM levestésztát külön főzd ki, és a tányérba tedd, különben a leves zavaros lesz, a tészta pedig szétmállik."}
      - {id: egg-noodles, en: Egg noodles (wheat), hu: Tojásos tészta, gluten: contains, swap: gf-pasta-long, pantry: false, aliases: [egg noodles, noodles, tojásos metélt, széles metélt, házi tészta, metélt tészta], tip_en: "GF pasta overcooks fast: boil it 1–2 minutes less than the packet says.", tip_hu: "A GM tészta könnyen szétfő: 1–2 perccel rövidebben főzd, mint a csomagon áll."}
      - {id: nokedli, en: Nokedli / spätzle, hu: Nokedli, gluten: contains, swap: gf-flour-mix, pantry: false, aliases: [galuska, spätzle, spaetzle, szaggatott galuska, nokedlit, galuskát, dumplings (nokedli)], tip_en: "GF nokedli: GF flour mix + 1 extra egg, rest the dough 10 min, drop small pieces and cook until they float.", tip_hu: "GM nokedli: GM lisztkeverék + 1 tojással több, a tészta pihenjen 10 percet, kis darabokat szaggass, és addig főzd, amíg feljönnek."}
      - {id: tarhonya, en: Tarhonya, hu: Tarhonya, gluten: contains, swap: gf-tarhonya, pantry: false, aliases: [egg barley, tarhonyát], tip_en: "GF tarhonya cooks faster: toast it in fat, then simmer about 12 minutes.", tip_hu: "A GM tarhonya gyorsabban fő: zsiradékon pirítsd, aztán kb. 12 percig párold."}
      - {id: csipetke, en: Csipetke, hu: Csipetke, gluten: contains, swap: gf-flour-mix, pantry: false, aliases: [pinched noodles, csipetkét], tip_en: "Pinch it from a stiff GF flour-mix-and-egg dough; it softens fast, so add it last.", tip_hu: "Kemény GM lisztkeverékes-tojásos tésztából csipkedd; hamar megpuhul, ezért utoljára tedd bele."}
      - {id: wheat-gnocchi, en: Gnocchi (wheat), hu: Gnocchi (búza), gluten: contains, swap: gf-gnocchi, pantry: false, aliases: [gnocchi, potato gnocchi, burgonyás gnocchi], tip_en: "GF gnocchi are softer: cook only until they float.", tip_hu: "A GM gnocchi puhább: csak addig főzd, amíg feljön."}
      - {id: udon, en: Udon, hu: Udon, gluten: contains, swap: rice-noodles, pantry: false, aliases: [udon noodles], tip_en: "Rice noodles: boil or soak briefly, then rinse cold so they don't stick.", tip_hu: "Rizstészta: röviden főzd vagy áztasd, aztán öblítsd hidegen, hogy ne ragadjon össze."}
      - {id: ramen-noodles, en: Ramen noodles, hu: Ramen tészta, gluten: contains, swap: rice-noodles, pantry: false, aliases: [ramen, instant noodles, wheat noodles], tip_en: "Rice noodles: boil or soak briefly, then rinse cold so they don't stick.", tip_hu: "Rizstészta: röviden főzd vagy áztasd, aztán öblítsd hidegen, hogy ne ragadjon össze."}
