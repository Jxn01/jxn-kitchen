      - {id: gf-tarhonya, en: Tarhonya (GF), hu: Tarhonya (GM), aliases: [gf tarhonya, gluténmentes tarhonya]}
      - {id: gf-gnocchi, en: Gnocchi (GF), hu: Gnocchi (GM), aliases: [gf gnocchi, gluténmentes gnocchi]}
