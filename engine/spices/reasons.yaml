# Reason codes → bilingual sentences (spec 2026-10-19 §4.2, §5.3). Every cell of the pair and food matrices names one.
#   kind   pair (placeholders {a} {b}: two spices) | food ({s}: a spice, {f}: a food)
#   sign   + | - | 0 — must match the sign of every score that uses it (a guard)
# Names go in lower case (the jar's `say` name or the catalogue name); the first letter of a sentence is capitalised.
# Hungarian templates avoid suffixes and articles on a placeholder, so any name reads right.

# --- pairs: good together ----------------------------------------------------------------------------------------------
classic-partners: {kind: pair, sign: "+", en: "{a} and {b} are classic partners.", hu: "{a} és {b}: klasszikus páros."}
hungarian-heart: {kind: pair, sign: "+", en: "{a} and {b} — the taste of the Hungarian kitchen.", hu: "{a} és {b} — a magyar konyha íze."}
same-family: {kind: pair, sign: "+", en: "{a} and {b} deepen the same note.", hu: "{a} és {b} ugyanazt a hangot mélyíti."}
lift: {kind: pair, sign: "+", en: "{a} and {b}: one grounds, the other lifts.", hu: "{a} és {b}: az egyik alapoz, a másik felemel."}
bridge: {kind: pair, sign: "+", en: "{a} and {b} share a note that ties them together.", hu: "{a} és {b}: egy közös hang összeköti őket."}
warm-together: {kind: pair, sign: "+", en: "{a} and {b} warm each other up.", hu: "{a} és {b} felmelegíti egymást."}
heat-and-aroma: {kind: pair, sign: "+", en: "{a} and {b} split the work: heat and aroma.", hu: "{a} és {b} megosztja a munkát: csípősség és illat."}
herb-garden: {kind: pair, sign: "+", en: "{a} and {b} grow in the same garden — easy together.", hu: "{a} és {b} egy kertben nő — könnyen összeillenek."}
sweet-savoury: {kind: pair, sign: "+", en: "{a} and {b} play sweet against savoury.", hu: "{a} és {b}: az édes és a sós jól játszik egymással."}
seasoning-basic: {kind: pair, sign: "+", en: "{a} and {b}: a basic that makes the other taste more like itself.", hu: "{a} és {b}: az alapízesítő kihozza a másikból, ami benne van."}
cuisine-mates: {kind: pair, sign: "+", en: "{a} and {b} cook together in the same kitchens.", hu: "{a} és {b} ugyanazokban a konyhákban főz együtt."}
gentle-company: {kind: pair, sign: "+", en: "{a} and {b} get along without fuss.", hu: "{a} és {b} gond nélkül megvan egymással."}

# --- pairs: nothing for or against -------------------------------------------------------------------------------------
strangers: {kind: pair, sign: "0", en: "{a} and {b} have nothing to say to each other.", hu: "{a} és {b} nem mond semmit egymásnak."}
harmless: {kind: pair, sign: "0", en: "{a} and {b} neither help nor hurt each other.", hu: "{a} és {b} se nem segít, se nem árt egymásnak."}

