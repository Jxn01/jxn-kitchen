    hu: Pörköltfűszer
    parts: {sweet-paprika: 4, caraway: 1, marjoram: 1, garlic-powder: 1, black-pepper: 0.5}
    method: {en: "Add it off the heat, with the onions.", hu: "A hagymához add, lehúzva a tűzről."}
