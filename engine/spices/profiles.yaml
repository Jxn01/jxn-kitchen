# Catalogue spices that are not rack jars, each with its reason (a guard: every spices.yaml item is one or the other)
not_on_rack:
  curry-powder: a ready-made blend — the engine knows its components, not the product
  garam-masala: a ready-made blend
  five-spice: a ready-made blend
  vegeta: a ready-made seasoning (and usually not GF)
  chicken-seasoning: a ready-made seasoning salt
  gyros-spice: a ready-made blend
  grill-spice: a ready-made blend
  cajun: a ready-made blend
  gingerbread-spice: a ready-made blend
  herbes-de-provence: a ready-made blend
  italian-herbs: a ready-made blend
  cinnamon-stick: the cinnamon jar covers both forms
  sea-salt: the salt jar
  vanilla-extract: a liquid — a sauce ingredient, not a dry spice
  vanilla-sugar: a sweetener, not a spice
