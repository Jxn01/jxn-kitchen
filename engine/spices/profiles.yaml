# One profile per rack jar (spec 2026-10-19 §4.2). Hand-judged, like every number in engine/. Fields:
#   id         a catalogue id (catalogue/food/*.yaml) — names, aliases and gluten come from there
#   say?       the short name on the jar and in sentences (default: the catalogue name, lower case)
#   shelf      meta.yaml shelves
#   fill       the jar's content colour; a jar on the know-how rack keeps the rack's colour and tag (tested)
#   tag        three words on the jar
#   axes       0-5 on each of the radar's eight axes
#   intensity  1-5: how far a level teaspoon goes (a teaspoon of cloves is not a teaspoon of parsley)
#   heat       0-5 (the know-how rack's heat)
#   role       base (the bulk) | body | accent | finisher (sprinkled at the end)
#   timing     bloom (in the hot fat) | during (with the liquid) | finish (at the end)
#   fragile    true: burns or goes bitter in hot fat, or loses its aroma to a long cook
#   form       whole (bought whole: grind it for a fine blend) | ground | both
#   cuisines   0-3 per cuisine (meta.yaml)
#   g_per_tsp  grams in one level teaspoon (the batch scaler)
