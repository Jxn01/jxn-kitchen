# The sauce shelves: one entry per item the sauce editor offers (or, `offer: false`, accepts only
# typed). Ids are catalogue ids; `item:` names the catalogue item when the shelf entry is one kitchen form of it (egg yolk
# of `eggs`, lime juice of `lime` — the catalogue keeps one item so recipes match what you have).
#   role     fat | acid | dairy | egg | allium | herb | umami | sweet | heat | thickener | liquid | veg — exactly one
#   driver   true = a flavour driver: judged in pairs/ and driver_foods/; false = structural: judged by the physics only
#   pairs_as the driver this entry pairs exactly like (only greek-yogurt, dijon, red-onion — a guard)
#   unit     the natural unit a tap adds `default` of; `step` is the ± increment; `alt` the units the chip flips to
#            (tbsp 15 ml · tsp 5 ml · dl 100 ml; g via g_per_ml; pcs via g_per_pc)
#   per100   0-10 per 100 g: salt = salt % ÷ 10 (salt 10, tamari 1.6) · acid against 10 % vinegar (= 10; lemon juice 6,
#            wine 1, yoghurt 1) · fat = fat % ÷ 10 (oil 10, butter 8.2, cream 3.3) · sweet = sugar % ÷ 10 (sugar 10,
#            honey 8) · heat: pungency, cayenne = 10 · umami: savoury depth, a stock cube = 10 · aromatic: aroma, raw
#            garlic = 10. A dual spice (also a rack jar) has aromatic 0: its aroma comes from its spice profile.
#   body     method none | slurry | roux | reduce | emulsify | puree | mount | liaison | base and power:
#            slurry/roux/liaison — grams per litre of liquid for a medium sauce (the know-how thickener table: midpoint
#            tbsp/l × g per tbsp); base/puree — the item's own body index (thin 0.3 · coats 1.2 · thick 2.4 · stiff 3.5+),
#            counted by its share of the sauce; mount — butter whisked into a pan sauce, by its share
#   stability emulsifier_ml: ml of oil one unit holds (a yolk 250, a teaspoon of mustard 50 — the know-how) ·
#            curdles: low-fat cultured dairy or milk that splits with acid and a boil · starch: which starch it is
#   keeps    raw-egg 2 d · fresh-dairy 3 · fresh 4 · oil-infusion 4 · cooked 5 · acid-preserved 14 · dry-stable 30
