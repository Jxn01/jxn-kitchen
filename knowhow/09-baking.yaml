      items:
        - label: {en: Dense and heavy, hu: Tömör és nehéz}
          icon: "om:1F35E"
          note: {en: "Too little water or binder, or under-proofed. Make the dough wetter, psyllium 5–8 % of the flour, proof to 1.5 times.", hu: "Kevés víz vagy kötőanyag, vagy kevés kelesztés. Nedvesebb tészta, az útifűmaghéj a liszt 5–8 %-a, kelesztés másfélszeresére."}
        - label: {en: Gummy inside, hu: Szalonnás belül}
          icon: "om:1F321"
          note: {en: "Underbaked, or sliced warm. Bake until the core reads 96–98 °C, then cool it for 2 hours before cutting.", hu: "Sületlen, vagy melegen szeletelted. Süsd, amíg a belseje 96–98 °C, és vágás előtt hűtsd 2 órán át."}
        - label: {en: Sank in the middle, hu: Középen beesett}
          icon: "om:26A0"
          note: {en: "Over-proofed or too wet. GF dough rises once, to about 1.5 times — not doubled.", hu: "Túlkelt vagy túl nedves. A GM tészta egyszer kel, kb. másfélszeresére — nem a duplájára."}
        - label: {en: Crumbles apart, hu: Szétmorzsálódik}
          icon: "om:1F9F1"
          note: {en: "Not enough binder or rest. Psyllium or xanthan, and rest the dough 15–30 minutes before shaping.", hu: "Kevés kötőanyag vagy pihentetés. Útifűmaghéj vagy xantán, és formázás előtt 15–30 perc pihentetés."}
        - label: {en: Tunnel under the crust, hu: Üreg a héj alatt}
          icon: "om:1F573"
          note: {en: "The crust set before the rise finished. Proof a little longer and give it steam at the start (a tray of water).", hu: "A héj hamarabb megkötött, mint ahogy befejezte a kelést. Keleszd kicsit tovább, és az elején adj gőzt (egy tál víz)."}
        - label: {en: Pale crust, hu: Sápadt héj}
          icon: "om:1F525"
          note: {en: "Too cool. Start hot — 230 °C for 15 minutes — and brush with milk or oil.", hu: "Túl hűvös. Kezdd forrón — 230 °C 15 percig —, és kend meg tejjel vagy olajjal."}
        - label: {en: Too dark too soon, hu: Túl korán sötét}
          icon: "om:1F321"
          note: {en: "GF flours brown faster. Lower the heat 10–15 °C or cover the loaf with foil for the last part.", hu: "A GM liszt hamarabb barnul. Vedd lejjebb 10–15 °C-kal, vagy a végére takard le fóliával."}
        - label: {en: Stale the next day, hu: Másnapra száraz}
          icon: "om:2744"
          note: {en: "GF bread stales within a day. Slice and freeze it on day one; toast from frozen.", hu: "A GM kenyér egy nap alatt kiszárad. Már az első nap szeleteld és fagyaszd; fagyosan pirítsd."}
    en:
      title: "Troubleshooting: GF bread"
      body: |
        | Problem | Likely cause | Fix |
        |---|---|---|
        | Dense and heavy | too little water or binder; under-proofed | wetter dough, psyllium 5–8 %, proof to 1.5× |
        | Gummy inside | underbaked or sliced warm | bake to 96–98 °C inside, cool 2 hours |
        | Sank in the middle | over-proofed or too wet | proof once, to about 1.5× — not doubled |
        | Crumbles apart | not enough binder or rest | psyllium or xanthan; rest 15–30 minutes |
        | Tunnel under the crust | the crust set before the rise finished | proof a little longer; steam at the start |
        | Pale crust | too cool | start at 230 °C; brush with milk or oil |
        | Too dark too soon | GF flours brown faster | 10–15 °C lower, or foil for the last part |
        | Stale the next day | GF bread stales fast | slice and freeze on day one, toast from frozen |

        See *GF bread* for the method, *Xanthan, psyllium and resting* for the binders.
    hu:
      title: "Hibaelhárítás: GM kenyér"
      body: |
        | Gond | Valószínű ok | Megoldás |
        |---|---|---|
        | Tömör és nehéz | kevés víz vagy kötőanyag; kevés kelesztés | nedvesebb tészta, útifűmaghéj 5–8 %, kelesztés másfélszeresre |
        | Szalonnás belül | sületlen vagy melegen szeletelve | süsd 96–98 °C-ig belül, hűtsd 2 órán át |
        | Középen beesett | túlkelt vagy túl nedves | egyszer keleszd, kb. másfélszeresre — nem duplájára |
        | Szétmorzsálódik | kevés kötőanyag vagy pihentetés | útifűmaghéj vagy xantán; 15–30 perc pihentetés |
        | Üreg a héj alatt | a héj megkötött, mielőtt befejezte a kelést | keleszd kicsit tovább; az elején gőz |
        | Sápadt héj | túl hűvös | kezdd 230 °C-on; kend meg tejjel vagy olajjal |
        | Túl korán sötét | a GM liszt hamarabb barnul | 10–15 °C-kal lejjebb, vagy a végére fólia |
        | Másnapra száraz | a GM kenyér hamar kiszárad | az első nap szeleteld és fagyaszd, fagyosan pirítsd |

        A módszert lásd a *GM kenyér*, a kötőanyagokat a *Xantán, útifűmaghéj és pihentetés* oldalon.
  - id: trouble-cakes
    chart:
      type: picker
      items:
        - label: {en: Dry and crumbly, hu: Száraz és morzsálódó}
          icon: "om:1F370"
          note: {en: "Too much flour or overbaked. Weigh the flour, add 1–2 tbsp yoghurt or oil, rest the batter 15–30 minutes, check 5 minutes early.", hu: "Sok liszt vagy túlsütve. Mérd grammra a lisztet, tégy bele 1–2 ek joghurtot vagy olajat, pihentesd a masszát 15–30 percig, 5 perccel előbb nézd meg."}
        - label: {en: Gritty, hu: Homokos}
          icon: "om:1F35A"
          note: {en: "The rice flour is coarse. Use superfine rice flour, and rest the batter 30 minutes so it softens.", hu: "Durva a rizsliszt. Finom őrlésű rizslisztet használj, és pihentesd a masszát 30 percig, hogy megpuhuljon."}
        - label: {en: Sank in the middle, hu: Középen beesett}
          icon: "om:26A0"
          note: {en: "Underbaked, the door opened early, or too much raising agent. Skewer test; keep the door shut for the first two thirds; GF baking powder, measured level.", hu: "Sületlen, korán kinyitottad az ajtót, vagy sok a sütőpor. Tűpróba; az első kétharmadban ne nyisd ki; GM sütőpor, csapott mérővel."}
        - label: {en: Gummy streak at the bottom, hu: Ragacsos csík alul}
          icon: "om:1F321"
          note: {en: "Too wet or underbaked. A little less liquid, a longer bake at a slightly lower heat.", hu: "Túl nedves vagy sületlen. Kicsit kevesebb folyadék, hosszabb sütés kicsit alacsonyabb hőn."}
        - label: {en: Cookies spread flat, hu: Szétfolyt keksz}
          icon: "om:1F36A"
          note: {en: "Warm butter, too much sugar, no binder. Chill the dough 30 minutes; ¼–½ tsp xanthan per 100 g flour.", hu: "Meleg vaj, sok cukor, nincs kötőanyag. Hűtsd a tésztát 30 percig; 100 g liszthez ¼–½ tk xantán."}
        - label: {en: Cookies hard as rock, hu: Kőkemény keksz}
          icon: "om:1F36A"
          note: {en: "Overbaked — GF bakes firm up as they cool. Take them out while the middle is still soft.", hu: "Túlsütve — a GM sütemény hűlve megkeményedik. Vedd ki, amíg a közepe még puha."}
        - label: {en: Browns too fast, hu: Túl gyorsan barnul}
          icon: "om:1F525"
          note: {en: "GF flours brown sooner. Bake 10–15 °C lower, cover with foil if needed.", hu: "A GM liszt hamarabb barnul. Süsd 10–15 °C-kal alacsonyabban, ha kell, takard le fóliával."}
        - label: {en: The sponge didn't rise, hu: Nem emelkedett a piskóta}
          icon: "om:1F95A"
          note: {en: "The eggs weren't whipped enough, or the flour was folded in too hard. Whip to a thick ribbon; fold gently.", hu: "Nem verted elég habosra a tojást, vagy erősen forgattad bele a lisztet. Sűrű, szalagos habbá verd; óvatosan forgasd."}
        - label: {en: Pastry cracks, hu: Repedő tészta}
          icon: "om:1F967"
          note: {en: "Too dry or too cold. A spoon of water, roll it between two sheets of baking paper, patch the cracks.", hu: "Túl száraz vagy túl hideg. Egy kanál víz, két sütőpapír között nyújtsd, a repedéseket foltozd be."}
        - label: {en: Tastes beany or bitter, hu: Babízű vagy keserű}
          icon: "om:1FAD8"
          note: {en: "Chickpea, bean or buckwheat flour. Mix it with rice flour and starch; vanilla, cinnamon or cocoa hide it.", hu: "Csicseri-, bab- vagy hajdinaliszt. Keverd rizsliszttel és keményítővel; a vanília, a fahéj vagy a kakaó elfedi."}
    en:
      title: "Troubleshooting: cakes and cookies"
      body: |
        | Problem | Likely cause | Fix |
        |---|---|---|
        | Dry and crumbly | too much flour; overbaked | weigh the flour; 1–2 tbsp yoghurt or oil; rest the batter 15–30 min; check early |
        | Gritty | coarse rice flour | superfine rice flour; rest the batter 30 minutes |
        | Sank in the middle | underbaked; door opened early; too much raising agent | skewer test; door shut for the first two thirds; GF baking powder, level |
        | Gummy streak at the bottom | too wet or underbaked | less liquid; longer, slightly cooler bake |
        | Cookies spread flat | warm butter, much sugar, no binder | chill the dough 30 min; ¼–½ tsp xanthan per 100 g |
        | Cookies hard as rock | overbaked | out while the middle is still soft |
        | Browns too fast | GF flours brown sooner | 10–15 °C lower; foil |
        | The sponge didn't rise | eggs under-whipped, flour folded too hard | whip to a thick ribbon; fold gently |
        | Pastry cracks | too dry or too cold | a spoon of water; roll between baking paper; patch |
        | Tastes beany or bitter | chickpea, bean or buckwheat flour | blend with rice flour and starch; vanilla, cinnamon, cocoa |

        > Baking powder: most is GF, but check — some contain wheat starch. The GF-labelled one is safe.
    hu:
      title: "Hibaelhárítás: sütemény és keksz"
      body: |
        | Gond | Valószínű ok | Megoldás |
        |---|---|---|
        | Száraz és morzsálódó | sok liszt; túlsütve | mérd grammra; 1–2 ek joghurt vagy olaj; 15–30 perc pihentetés; nézd meg előbb |
        | Homokos | durva rizsliszt | finom őrlésű rizsliszt; 30 perc pihentetés |
        | Középen beesett | sületlen; korán nyitott ajtó; sok sütőpor | tűpróba; az első kétharmadban zárt ajtó; GM sütőpor, csapottan |
        | Ragacsos csík alul | túl nedves vagy sületlen | kevesebb folyadék; hosszabb, kicsit hűvösebb sütés |
        | Szétfolyt keksz | meleg vaj, sok cukor, nincs kötőanyag | 30 perc hűtés; 100 g-hoz ¼–½ tk xantán |
        | Kőkemény keksz | túlsütve | vedd ki, amíg a közepe puha |
        | Túl gyorsan barnul | a GM liszt hamarabb barnul | 10–15 °C-kal alacsonyabban; fólia |
        | Nem emelkedett a piskóta | kevés habverés, erős forgatás | sűrű, szalagos habbá; óvatos forgatás |
        | Repedő tészta | túl száraz vagy hideg | egy kanál víz; sütőpapírok között nyújtsd; foltozd |
        | Babízű vagy keserű | csicseri-, bab- vagy hajdinaliszt | keverd rizsliszttel és keményítővel; vanília, fahéj, kakaó |

        > Sütőpor: a legtöbb GM, de ellenőrizd — némelyikben búzakeményítő van. A GM jelölésű biztonságos.
