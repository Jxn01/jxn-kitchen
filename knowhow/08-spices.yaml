  - id: whole-ground
    chart:
      type: bars
      unit: {en: months, hu: hónap}
      max: 26
      items:
        - {value: 12, to: 24, label: {en: Whole spices, hu: Egész fűszer}, fill: "#8A6A3B", note: {en: "grind as you go", hu: "frissen őröld"}}
        - {value: 6, label: {en: Ground spices, hu: Őrölt fűszer}, fill: "#C99A4A", note: {en: about 6 months, hu: kb. 6 hónap}}
    en:
      title: Whole vs ground, fresh vs dried
      body: |
        - **Whole spices** keep their aroma for 1–2 years; **ground** ones fade in about 6 months. Buy small, grind as
          you go (a mortar or an old coffee grinder).
        - **Toast whole spices** (cumin, coriander, caraway, fennel) in a dry pan for 30–60 seconds until fragrant, then
          grind: twice the flavour.
        - **Bloom ground spices** in hot fat for a few seconds — but **paprika and chilli burn instantly**: always off the
          heat (see *Hungarian technique*).
        - **Fresh herbs:** woody ones (rosemary, thyme, bay) go in early; soft ones (parsley, dill, basil, chives,
          coriander) go in at the end.
        - **Dried herbs:** use about a third of the fresh amount, early in the cooking.
        - Store spices dark, dry and away from the stove's steam.

        > Single spices are GF. **Blends** (curry powder, gyros or grill mixes, bouillon powders) can contain wheat flour as a carrier or anti-caking agent — read the label.
    hu:
      title: Egész vagy őrölt, friss vagy szárított
      body: |
        - Az **egész fűszer** 1–2 évig megtartja az illatát; az **őrölt** kb. 6 hónap alatt elveszti. Vegyél kis
          kiszerelést, és őrölj frissen (mozsár vagy egy régi kávédaráló).
        - **Pirítsd** az egész fűszert (római kömény, koriander, kömény, édeskömény) száraz serpenyőben 30–60 másodpercig,
          amíg illatos, aztán őröld: kétszer ízesebb.
        - Az őrölt fűszert **forró zsiradékban** pár másodpercig engedd ki — de **a pirospaprika és a chili azonnal megég**:
          mindig a tűzről levéve (lásd *Magyaros technikák*).
        - **Friss zöldfűszer:** a fás szárúak (rozmaring, kakukkfű, babér) korán mennek bele; a puhák (petrezselyem, kapor,
          bazsalikom, metélőhagyma, koriander) a végén.
        - **Szárított zöldfűszer:** a friss mennyiség kb. harmada, a főzés elején.
        - A fűszert sötétben, szárazon, a tűzhely gőzétől távol tárold.

        > Az egynemű fűszer GM. A **keverékekben** (curry, gyros- és grillfűszer, levesporok) hordozóként vagy csomósodásgátlóként lehet búzaliszt — olvasd el a címkét.
  - id: paprika
    chart:
      type: swatches
      items:
        - {fill: "#E2231A", label: Különleges, heat: 0, note: {en: "The finest: bright red and mild. For finishing and garnish.", hu: "A legfinomabb: élénkpiros és enyhe. Befejezéshez, díszítéshez."}}
        - {fill: "#C8281E", label: Édesnemes, heat: 0, note: {en: "Noble sweet — sweet and full, the everyday one: pörkölt, paprikás, gulyás.", hu: "Édes, telt, a mindennapi: pörkölt, paprikás, gulyás."}}
        - {fill: "#CC3B22", label: Csemege, heat: 1, note: {en: "Mild, slightly spicy. For everyday cooking.", hu: "Enyhe, kissé csípős. A mindennapi főzéshez."}}
        - {fill: "#B9451F", label: Félédes, heat: 1, note: {en: "Half-sweet with a little heat. Sausages, stews.", hu: "Félédes, egy kis csípősséggel. Kolbászba, ragukba."}}
        - {fill: "#B5532B", label: Rózsa, heat: 2, note: {en: "Aromatic and mildly hot. Stronger stews.", hu: "Aromás, enyhén csípős. Erősebb ragukba."}}
        - {fill: "#A8331C", label: {en: Erős / csípős, hu: Erős / csípős}, heat: 4, note: {en: "Hot. To taste, together with sweet paprika.", hu: "Csípős. Ízlés szerint, édes paprikával együtt."}}
        - {fill: "#7E2A1A", label: Füstölt, note: {en: "Smoked. Lecsó, beans, roasts.", hu: "Füstölt. Lecsóba, babhoz, sültekhez."}}
    en:
      title: Hungarian paprika
      body: |
        | Kind | Taste | Use |
        |---|---|---|
        | Különleges | the finest, bright red, mild | finishing, garnish |
        | Édesnemes (noble sweet) | sweet, full, the everyday one | pörkölt, paprikás, gulyás |
        | Csemege | mild, slightly spicy | everyday cooking |
        | Félédes | half-sweet, a little heat | sausages, stews |
        | Rózsa | aromatic, mildly hot | stronger stews |
        | Erős / csípős | hot | to taste, with sweet paprika |
        | Füstölt | smoked | lecsó, beans, roasts |

        - Its sugars burn within seconds in hot fat and it turns bitter: add it to fat **off the flame**, or to a dish
          that already has liquid.
        - Kept in the fridge or freezer, an open bag stays red and sweet far longer.
    hu:
      title: Magyar pirospaprika
      body: |
        | Fajta | Íz | Mire |
        |---|---|---|
        | Különleges | a legfinomabb, élénkpiros, enyhe | befejezés, díszítés |
        | Édesnemes | édes, teltebb, a mindennapi | pörkölt, paprikás, gulyás |
        | Csemege | enyhe, kissé csípős | mindennapi főzés |
        | Félédes | félédes, kicsit csíp | kolbász, raguk |
        | Rózsa | illatos, enyhén csípős | erősebb raguk |
        | Erős / csípős | csípős | ízlés szerint, édes paprikával |
        | Füstölt | füstös | lecsó, bab, sültek |

        - A cukortartalma forró zsiradékban másodpercek alatt megég, és megkeseredik: a zsiradékhoz **lehúzva a tűzről**
          add, vagy olyan ételhez, amiben már van folyadék.
        - Hűtőben vagy mélyhűtőben a megbontott zacskó sokkal tovább marad piros és édes.
