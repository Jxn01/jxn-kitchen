      body: |
        Mi van a híres keverékekben, és mire valók. Sokuk receptje a *Házi keverék* oldalon van.

        | Keverék | Mi van benne | Mihez illik | Tipp |
        |---|---|---|---|
        | **Za'atar** | kakukkfű, szömörce, szezám, só | GM lepény, tojás, joghurt, sült zöldség | Olívaolajba keverve mártogatós. |
        | **Ras el hanout** | római kömény, gyömbér, koriander, fahéj, kurkuma, paprika, kardamom | bárány, csicseriborsó, répa, köles- vagy quinoa-„kuszkusz” | „A bolt legjava” — minden marokkói fűszeresnek saját receptje van. |
        | **Baharat** | fekete bors, paprika, római kömény, koriander, fahéj, szegfűszeg, kardamom, szerecsendió | kebab, kofta, rizs, lencseleves | A Közel-Kelet mindennapi keveréke — meleg, nem csípős. |
        | **Berbere** | chili, görögszéna, gyömbér, koriander, kardamom, szegfűbors, szegfűszeg | etióp raguk (doro wat), lencse, sült hús | Csípős és mély — előbb finoman pirítsd zsiradékban. |
        | **Garam masala** | koriander, római kömény, kardamom, bors, fahéj, szegfűszeg, szerecsendió | curryk, dal, bárány, sült zöldség | A végén keverd bele, ne az elején pirítsd. |
        | **Kínai ötfűszer** | csillagánizs, szegfűszeg, fahéj, édeskömény, szecsuáni bors | kacsa, sertésoldalas, wokos ételek, sült tök | Erős: egy teáskanál egy egész kacsához elég. |
        | **Cajun** | paprika, fokhagyma, hagyma, cayenne, kakukkfű, oregánó, bors | csirke, garnélarák, steakburgonya, kukorica | Forrólevegős sütőben remek: olaj, cajun, 200 °C. |
        | **Jerk** | szegfűbors, kakukkfű, chili, fokhagyma, gyömbér, fahéj | csirke, sertés, grillezett zöldség | Jamaica keveréke; a szíve a szegfűbors. |
        | **Dukkah** | pirított mogyoró, szezám, koriander, római kömény, só | olívaolajba mártott GM kenyér, saláták, tojás, hal | Ropogós: a diót csak durvára darald, ne porrá. |
        | **Taco** | chili, római kömény, paprika, fokhagyma, oregánó | darált hús, bab, chili con carne, sült zöldség | A bolti tasakokban gyakran búzaliszt van — készítsd el magad. |

        > **Cöliákia:** a bolti keverékben **búzaliszt vagy -keményítő** lehet töltőanyagként — GM jelölésűt vegyél, vagy keverd ki egynemű fűszerekből.
