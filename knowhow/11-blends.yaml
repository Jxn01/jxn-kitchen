    en:
      title: Hungarian kitchen blends
      body: |
        The jars a Hungarian kitchen reaches for — all GF when you mix them yourself.

        | Blend | What is in it | Goes with | Tip |
        |---|---|---|---|
        | **Pörkölt** | sweet paprika, caraway, marjoram, garlic, black pepper | pörkölt, paprikás, gulyás, roast pork | Into the onions off the heat — paprika burns in seconds. |
        | **Kolbász** | sweet and hot paprika, garlic, caraway, black pepper | home-made sausage, sausage-style mince, lecsó | About 2 tablespoons and 18–20 g salt per kilo of mince. |
        | **Chicken seasoning** | paprika, garlic, onion, black pepper, thyme, salt | roast chicken, wings, thighs, air-fried chicken | Shop “csirkefűszer” often carries wheat or flavour enhancer — mix your own. |
        | **Roast potato** | paprika, garlic, rosemary, caraway, salt | roast or air-fried potatoes, wedges | Toss the potatoes in oil first, then the blend. |
        | **Pickling (savanyúság)** | mustard seed, coriander seed, peppercorns, dill seed, allspice, bay | vinegar pickles, csalamádé, pickled peppers | Whole spices — a tablespoon per litre jar. |
        | **Mulled wine (forralt bor)** | cinnamon, orange peel, clove, star anise, allspice, cardamom | red wine (or grape juice), 3–4 tbsp sugar per litre | Heat to 70–80 °C — never boil, or the alcohol and aroma go. |
        | **Gingerbread** | cinnamon, ginger, clove, nutmeg, allspice, cardamom, star anise | gingerbread (GF flour), apple desserts, mulled wine, coffee | Shop “mézeskalács fűszer” is usually just spices — check anyway. |

        > **Celiac:** a shop blend can carry **wheat flour or starch** as a filler — buy GF-labelled or mix your own from single spices.
    hu:
      title: Magyar konyha keverékei
      body: |
        A magyar konyha kedvenc üvegei — házilag keverve mind gluténmentes.

        | Keverék | Mi van benne | Mihez illik | Tipp |
        |---|---|---|---|
        | **Pörkölt** | édesnemes paprika, kömény, majoránna, fokhagyma, fekete bors | pörkölt, paprikás, gulyás, sült sertés | A hagymára, lehúzva a tűzről — a paprika másodpercek alatt megég. |
        | **Kolbász** | édes és erős paprika, fokhagyma, kömény, fekete bors | házi kolbász, kolbászos darált hús, lecsó | Kilónként kb. 2 evőkanál és 18–20 g só a darált húshoz. |
        | **Csirkefűszer** | paprika, fokhagyma, hagyma, fekete bors, kakukkfű, só | sült csirke, szárny, comb, forrólevegős csirke | A bolti csirkefűszerben gyakran búza vagy ízfokozó van — keverd magad. |
        | **Sült krumpli** | paprika, fokhagyma, rozmaring, kömény, só | sült vagy forrólevegős krumpli, steakburgonya | Előbb olajban forgasd meg a krumplit, aztán a fűszerben. |
        | **Savanyúságfűszer** | mustármag, koriandermag, egész bors, kapormag, szegfűbors, babér | ecetes savanyúság, csalamádé, ecetes paprika | Egész fűszerek — literes üveghez egy evőkanál. |
        | **Forralt bor** | fahéj, narancshéj, szegfűszeg, csillagánizs, szegfűbors, kardamom | vörösbor (vagy szőlőlé), literenként 3–4 ek cukor | 70–80 °C-ra melegítsd — ne forrald, mert elszáll az alkohol és az illat. |
        | **Mézeskalács** | fahéj, gyömbér, szegfűszeg, szerecsendió, szegfűbors, kardamom, csillagánizs | mézeskalács (GM liszttel), almás desszertek, forralt bor, kávé | A bolti mézeskalács-fűszer általában csak fűszer — azért ellenőrizd. |

        > **Cöliákia:** a bolti keverékben **búzaliszt vagy -keményítő** lehet töltőanyagként — GM jelölésűt vegyél, vagy keverd ki egynemű fűszerekből.
