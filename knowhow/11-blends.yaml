    en:
      title: World blends
      body: |
        What is in the famous blends and what they are for. Recipes for many of them are on *Make your own*.

        | Blend | What is in it | Goes with | Tip |
        |---|---|---|---|
        | **Za'atar** | thyme, sumac, sesame, salt | GF flatbread, eggs, yoghurt, roast vegetables | Stir into olive oil for a dip. |
        | **Ras el hanout** | cumin, ginger, coriander, cinnamon, turmeric, paprika, cardamom | lamb, chickpeas, carrots, millet or quinoa “couscous” | “The shop’s best” — every Moroccan spice seller has their own. |
        | **Baharat** | black pepper, paprika, cumin, coriander, cinnamon, clove, cardamom, nutmeg | kebabs, kofta, rice, lentil soup | The Middle East’s everyday blend — warm, not hot. |
        | **Berbere** | chilli, fenugreek, ginger, coriander, cardamom, allspice, clove | Ethiopian stews (doro wat), lentils, roast meat | Hot and deep — fry it gently in fat first. |
        | **Garam masala** | coriander, cumin, cardamom, pepper, cinnamon, clove, nutmeg | curries, dal, lamb, roast vegetables | Stirred in at the end, not fried at the start. |
        | **Chinese five-spice** | star anise, clove, cinnamon, fennel, Sichuan pepper | duck, pork belly, stir-fries, roast squash | Strong: a teaspoon seasons a whole duck. |
        | **Cajun** | paprika, garlic, onion, cayenne, thyme, oregano, pepper | chicken, prawns, potato wedges, corn | Great in the air fryer: oil, Cajun, 200 °C. |
        | **Jerk** | allspice, thyme, chilli, garlic, ginger, cinnamon | chicken, pork, grilled vegetables | Jamaica’s blend; allspice is its heart. |
        | **Dukkah** | toasted hazelnuts, sesame, coriander, cumin, salt | GF bread dipped in olive oil, salads, eggs, fish | Crunchy: pulse the nuts coarse, not to powder. |
        | **Taco** | chilli, cumin, paprika, garlic, oregano | mince, beans, chilli con carne, roast vegetables | Shop packets often hold wheat flour — make it yourself. |

        > **Celiac:** a shop blend can carry **wheat flour or starch** as a filler — buy GF-labelled or mix your own from single spices.
    hu:
