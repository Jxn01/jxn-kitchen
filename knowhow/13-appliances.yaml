        - {label: {en: French press, hu: Dugattyús kávé}, icon: "om:2615", value: "93–96 °C", note: {en: "Boil, then wait 30 seconds.", hu: "Forrald fel, aztán várj 30 másodpercet."}}
        - {label: {en: Pasta water head start, hu: Előny a tésztavíznek}, icon: "om:1F35D", note: {en: "Boil the water in the kettle and pour it into the pot — faster and cheaper than heating it on the hob.", hu: "Forrald fel a vizet a forralóban, és öntsd a fazékba — gyorsabb és olcsóbb, mint a főzőlapon."}}
        - {label: {en: Peeling tomatoes, hu: Paradicsomhámozás}, icon: "om:1F345", value: "30 s", note: {en: "Cut a cross in the skin, cover with boiling water for 30 seconds, then cold water — the skin slips off. Peaches too.", hu: "Vágj keresztet a héjába, 30 másodpercre önts rá forró vizet, aztán hideg víz — a héja lecsúszik. Barackkal is."}}
        - {label: {en: Soaking dried mushrooms, hu: Szárított gomba áztatása}, icon: "om:1F344", value: {en: "20 min", hu: "20 perc"}, note: {en: "Hot water over dried mushrooms or sun-dried tomatoes; keep the soaking water for the sauce.", hu: "Forró víz a szárított gombára vagy aszalt paradicsomra; az áztatóvizet tedd a mártásba."}}
        - {label: {en: Rice noodles, hu: Rizstészta}, icon: "om:1F35C", value: {en: "3–5 min", hu: "3–5 perc"}, note: {en: "Pour boiling water over thin rice noodles and wait. Rice-only noodles are GF — check the label.", hu: "Önts forró vizet a vékony rizstésztára, és várj. A csak rizsből készült tészta GM — nézd meg a címkét."}}
        - {label: {en: Rinsing jars, hu: Befőttesüvegek}, icon: "om:1FAD9", note: {en: "Boiling water into clean jars and over the lids before hot jam goes in; to sterilise, dry them in the oven at 120 °C.", hu: "Forró víz a tiszta üvegekbe és a tetőkre, mielőtt a forró lekvár bekerül; csírátlanításhoz 120 °C-os sütőben szárítsd."}}
        - {label: {en: Descaling, hu: Vízkőtelenítés}, icon: "om:1F34B", value: {en: "monthly", hu: "havonta"}, note: {en: "Half full of water with 1–2 tbsp citric acid (or vinegar): boil, leave 20 minutes, rinse twice.", hu: "Félig vízzel, 1–2 ek citromsavval (vagy ecettel): forrald fel, hagyd 20 percig, öblítsd ki kétszer."}}
        - {label: {en: Only what you need, hu: Csak amennyi kell}, icon: "om:26A1", note: {en: "Boil only the water you need — a full kettle takes far longer and uses far more power.", hu: "Csak annyi vizet forralj, amennyi kell — a teli forraló sokkal tovább tart és sokkal több áramot fogyaszt."}}
    en:
      title: Kettle
      body: |
        The fastest way to boiling water — and more useful than tea alone.

        - **Tea:** green and white tea want 70–85 °C — let it rest: about 95 °C after 1 minute, 85 °C after 3, 75–80 °C
          after 5 (lid open).
        - **French press:** boil, then wait 30 seconds (93–96 °C).
        - **Pasta water:** boil it in the kettle and pour it into the pot — faster and cheaper than the hob.
        - **Peeling tomatoes or peaches:** a cross in the skin, 30 seconds under boiling water, then cold water.
        - **Dried mushrooms, sun-dried tomatoes:** 20 minutes in hot water; keep the water for the sauce.
        - **Rice noodles:** boiling water over them, 3–5 minutes. Rice-only noodles are GF — check the label.
        - **Jars:** boiling water into clean jars and over the lids before hot jam; to sterilise, dry them in the oven at 120 °C.
        - **Descale monthly** with hard water: half full, 1–2 tbsp citric acid (or vinegar), boil, leave 20 minutes, rinse twice.
        - Boil only what you need — a full kettle takes far longer.
        - Water only: milk, soup or instant drinks burn onto the element.
    hu:
      title: Vízforraló
      body: |
        A leggyorsabb út a forró vízhez — és nemcsak teához jó.

        - **Tea:** a zöld és fehér tea 70–85 °C-ot kér — hagyd pihenni: 1 perc után kb. 95 °C, 3 után 85, 5 után
          75–80 °C (nyitott fedővel).
        - **Dugattyús kávé:** forrald fel, aztán várj 30 másodpercet (93–96 °C).
        - **Tésztavíz:** forrald a forralóban, és öntsd a fazékba — gyorsabb és olcsóbb, mint a főzőlapon.
        - **Paradicsom, barack hámozása:** kereszt a héjába, 30 másodperc forró víz alatt, aztán hideg víz.
        - **Szárított gomba, aszalt paradicsom:** 20 perc forró vízben; az áztatóvizet tedd a mártásba.
        - **Rizstészta:** forró vizet rá, 3–5 perc. A csak rizsből készült tészta GM — nézd meg a címkét.
        - **Befőttesüvegek:** forró víz a tiszta üvegekbe és a tetőkre a forró lekvár előtt; csírátlanításhoz 120 °C-os
          sütőben szárítsd.
        - **Vízkőtelenítés havonta** kemény víznél: félig vízzel, 1–2 ek citromsavval (vagy ecettel) forrald fel,
          hagyd 20 percig, öblítsd ki kétszer.
        - Csak annyit forralj, amennyi kell — a teli forraló sokkal tovább tart.
        - Csak vizet: a tej, a leves és az instant italok odaégnek a fűtőelemre.
  - id: stove
    chart:
      type: scale
      unit: {en: level, hu: fokozat}
      min: 0
