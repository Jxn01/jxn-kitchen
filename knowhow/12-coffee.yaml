          note: {en: "A double ristretto with thin, velvety milk.", hu: "Dupla ristretto vékony, bársonyos tejjel."}
          layers:
            - {fill: "#2E1B10", part: 1.5, label: {en: double ristretto, hu: dupla ristretto}}
            - {fill: "#EADCC8", part: 2.5, label: {en: steamed milk, hu: gőzölt tej}}
