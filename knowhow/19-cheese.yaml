  - id: storing
    chart:
      type: steps
      items:
        - {icon: "om:1F4C4", label: {en: Wrap it, hu: Csomagolás}, note: {en: "In baking or waxed paper, then loosely in a box — cling film straight on the cheese makes it sweat.", hu: "Sütő- vagy viaszos papírba, aztán lazán egy dobozba — a közvetlenül rátett fólia alatt bebefullad."}}
        - {icon: "om:1F9CA", label: {en: The cheese drawer, hu: A sajtfiók}, note: {en: "The vegetable drawer or a cheese box, about 4–8 °C. Strong cheeses in their own box.", hu: "A zöldségfiók vagy egy sajtdoboz, kb. 4–8 °C. Az erős szagúak külön dobozba."}}
        - {icon: "om:1F552", label: {en: Room temperature, hu: Szobahőmérséklet}, time: {en: "30–60 min", hu: "30–60 perc"}, note: {en: "Out of the fridge 30–60 minutes before serving — cold cheese tastes of little.", hu: "Tálalás előtt 30–60 perccel vedd ki a hűtőből — a hideg sajtnak alig van íze."}}
        - {icon: "om:1F9A0", label: {en: Mould, hu: Penész}, note: {en: "Hard cheese: cut off at least 2.5 cm around and below the spot. Soft, fresh, grated or sliced cheese: throw it out.", hu: "Kemény sajt: legalább 2,5 cm-t vágj le a folt körül és alatt. Lágy, friss, reszelt vagy szeletelt sajt: dobd ki."}}
        - {icon: "om:2744", label: {en: Freeze, hu: Fagyasztás}, note: {en: "Grated hard and semi-hard cheese freezes well for cooking; soft and fresh cheeses turn crumbly.", hu: "A reszelt kemény és félkemény sajt jól fagyasztható főzéshez; a lágy és friss sajt morzsálódó lesz."}}
    en:
      title: Storing and serving
      body: |
        1. **Wrap it** in baking or waxed paper, then loosely in a box — cling film straight on it makes it sweat.
        2. **The cheese drawer:** the vegetable drawer or a cheese box, about 4–8 °C; strong cheeses in their own box.
        3. **Room temperature:** out of the fridge 30–60 minutes before serving.
        4. **Mould:** on hard cheese, cut away at least **2.5 cm** around and below the spot; soft, fresh, grated or sliced
           cheese with mould goes in the bin (blue cheese's own veins are the exception, of course).
        5. **Freeze** grated hard and semi-hard cheese for cooking; soft and fresh cheeses go crumbly.

        | Cheese | Keeps (fridge, opened) |
        |---|---|
        | Fresh (túró, mozzarella, ricotta) | 3–7 days |
        | Soft (camembert, brie) | about a week |
        | Semi-hard (trappista, gouda) | 2–3 weeks |
        | Hard (parmesan) | 3–4 weeks and more |
    hu:
      title: Tárolás és tálalás
      body: |
        1. **Csomagold** sütő- vagy viaszos papírba, aztán lazán egy dobozba — a közvetlenül rátett fólia alatt bebefullad.
        2. **A sajtfiók:** a zöldségfiók vagy egy sajtdoboz, kb. 4–8 °C; az erős szagúak külön dobozba.
        3. **Szobahőmérséklet:** tálalás előtt 30–60 perccel vedd ki a hűtőből.
        4. **Penész:** kemény sajtról legalább **2,5 cm-t** vágj le a folt körül és alatt; a penészes lágy, friss, reszelt
           vagy szeletelt sajt a kukába megy (a kéksajt saját erezete persze kivétel).
        5. **Fagyaszd** a reszelt kemény és félkemény sajtot főzéshez; a lágy és friss sajt morzsálódó lesz.

        | Sajt | Eláll (hűtőben, felbontva) |
        |---|---|
        | Friss (túró, mozzarella, ricotta) | 3–7 nap |
        | Lágy (camembert, brie) | kb. egy hét |
        | Félkemény (trappista, gouda) | 2–3 hét |
        | Kemény (parmezán) | 3–4 hét és tovább |
  - id: gluten
    chart:
      type: picker
      items:
        - {label: {en: Plain cheese, hu: Natúr sajt}, icon: "om:2705", value: {en: GF, hu: GM}, note: {en: "Milk, cultures, rennet, salt: naturally gluten-free — blue cheeses included.", hu: "Tej, kultúra, oltó, só: természettől gluténmentes — a kéksajtok is."}}
        - {label: {en: "Processed cheese, spreads", hu: "Ömlesztett sajt, krémsajt"}, icon: "om:26A0", value: {en: check, hu: ellenőrizd}, note: {en: "Some use wheat starch or other additives — read the label (Medve-type portions, Pikáns-type spreads).", hu: "Némelyikben búzakeményítő vagy más adalék van — olvasd el a címkét (Medve-féle kockák, Pikáns-féle krémek)."}}
        - {label: {en: Grated cheese, hu: Reszelt sajt}, icon: "om:26A0", value: {en: check, hu: ellenőrizd}, note: {en: "The anti-caking agent is usually potato starch or cellulose — rarely wheat. Check, or grate your own.", hu: "A csomósodásgátló általában burgonyakeményítő vagy cellulóz — ritkán búza. Ellenőrizd, vagy reszeld magad."}}
        - {label: {en: Beer-washed rinds, hu: Sörrel mosott kéreg}, icon: "om:1F37A", value: {en: avoid, hu: kerüld}, note: {en: "Some washed-rind cheeses are washed with beer — the rind can carry gluten.", hu: "Néhány mosott kérgű sajtot sörrel mosnak — a kéreg glutént hordozhat."}}
        - {label: {en: "Breaded cheese (rántott sajt)", hu: Rántott sajt}, icon: "om:274C", value: {en: wheat, hu: búza}, note: {en: "Ready-breaded cheese is wheat — bread it yourself with GF crumbs, rice flour and egg.", hu: "A kész panírozott sajt búzás — panírozd magad GM morzsával, rizsliszttel és tojással."}}
        - {label: {en: Cheese sauce and fondue mixes, hu: Sajtmártás- és fondükeverék}, icon: "om:26A0", value: {en: check, hu: ellenőrizd}, note: {en: "Often thickened with wheat flour. Make your own with cornstarch (fondue) or rice-flour béchamel.", hu: "Gyakran búzaliszttel sűrítik. Készítsd magad kukoricakeményítővel (fondü) vagy rizslisztes besamellel."}}
    en:
      title: Cheese and gluten
      body: |
        - **Plain cheese is gluten-free** — milk, cultures, rennet and salt. Blue cheeses too: their mould does not
          carry gluten into the cheese.
        - **Check the label:** processed cheese and spreads (some use wheat starch), pre-grated cheese (the
          anti-caking agent is usually potato starch or cellulose, rarely wheat), cheese sauce and fondue mixes (flour).
        - **Avoid:** beer-washed rinds, and ready-breaded cheese — make **rántott sajt** yourself with GF crumbs.
    hu:
      title: Sajt és glutén
      body: |
        - **A natúr sajt gluténmentes** — tej, kultúra, oltó és só. A kéksajtok is: a penészük nem visz glutént a sajtba.
        - **Olvasd el a címkét:** ömlesztett sajt és krémsajt (némelyikben búzakeményítő van), reszelt sajt (a
          csomósodásgátló általában burgonyakeményítő vagy cellulóz, ritkán búza), sajtmártás- és fondükeverék (liszt).
        - **Kerüld:** a sörrel mosott kérget és a kész panírozott sajtot — a **rántott sajtot** készítsd magad GM morzsával.
