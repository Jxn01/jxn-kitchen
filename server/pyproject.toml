[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchen"
version = "0.1.0"
description = "JXN Kitchen — a touch-first kitchen companion for a gluten-free kitchen"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.118.*",
  "uvicorn==0.37.*",
  "httpx==0.28.*",
  "pyyaml==6.*",
  "rapidfuzz==3.*",
  "recipe-scrapers==15.*",
  "pillow==12.*",
]

[project.optional-dependencies]
test = ["pytest==8.*", "fonttools[woff]==4.*"]


[tool.setuptools]
packages = ["kitchen"]
